{% extends "base.html" %}
{% block title %}Sign in — TenderRadar{% endblock %}
{% block content %}
<div style="max-width:440px;margin:0 auto">
  <h1 class="page">Sign in</h1>
  {% if errors.token %}<p style="color:var(--urgent);font-size:14px">{{ errors.token }}</p>{% endif %}
  <form method="post" action="/signin" class="card" style="padding:20px">
    <label style="display:block;font-weight:600;margin-bottom:5px">Email</label>
    <input name="email" type="email" required placeholder="you@company.com"
           style="width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:15px">
    <button type="submit" style="margin-top:16px;width:100%;background:var(--brand);
            color:#fff;border:0;padding:12px;border-radius:8px;font-size:15px;cursor:pointer">
      Email me a sign-in link
    </button>
    <p style="color:var(--muted);font-size:12.5px;margin:12px 0 0;text-align:center">
      No password needed.
    </p>
  </form>
  <p style="text-align:center;margin:16px 0 0;font-size:14px">
    New here? <a href="/signup">Create an account</a>
  </p>
</div>
{% endblock %}
