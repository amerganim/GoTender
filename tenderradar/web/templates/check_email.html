{% extends "base.html" %}
{% block title %}Check your email — TenderRadar{% endblock %}
{% block content %}
<div class="card" style="padding:34px;text-align:center;max-width:520px;margin:0 auto">
  <div style="font-size:38px;line-height:1">📧</div>
  <h1 class="page" style="margin:12px 0 8px">Check your email</h1>
  <p style="color:var(--muted);margin:0">
    If <strong>{{ email }}</strong> has an account, a sign-in link is on its way.
    It signs you in — no password needed.
  </p>
  <p style="margin:20px 0 0"><a href="/tenders">Browse tenders meanwhile →</a></p>
</div>
{% endblock %}
