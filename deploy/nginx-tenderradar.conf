# nginx site config. Obtain the certificate first:
#   sudo certbot --nginx -d tenderradar.com.bd -d www.tenderradar.com.bd

server {
    listen 80;
    listen [::]:80;
    server_name tenderradar.com.bd www.tenderradar.com.bd;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tenderradar.com.bd www.tenderradar.com.bd;

    ssl_certificate     /etc/letsencrypt/live/tenderradar.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tenderradar.com.bd/privkey.pem;

    # Web Push and service workers require a secure context; without HTTPS the
    # notification feature simply does not exist for users.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gate 1 asks for under 2s on 3G. The pages are server-rendered HTML with
    # inline CSS, so compression is most of the win available.
    gzip on;
    gzip_types text/html text/css application/javascript application/xml+rss
               application/json image/svg+xml;
    gzip_min_length 512;

    client_max_body_size 2m;

    # The service worker must be served from the root with its own scope
    # header, or push notifications cannot reach pages outside /static.
    location = /sw.js {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The admin dashboard is behind a session check in the app, but it has no
    # business being indexed or reachable from the open internet by accident.
    location /admin {
        # Replace with the operator's address, or drop this block and rely on
        # the app's own check if working from changing IPs.
        # allow 203.0.113.4;
        # deny all;
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
